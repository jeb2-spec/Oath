# Publish the rendered register with GitHub Pages. ECOSYSTEM.md §1.5 named GitHub
# Pages as one of two hosts; keeping everything on GitHub was the maintainer's call
# on 2026-09-22.
#
# The maintainer enabled Pages with GitHub Actions as its source and flipped the site
# public on 2026-09-23, after the Council's first reading of the pages (PR #27). The
# repository may stay private; the site is public. Every push to main publishes.
#
# Every page published here is one self-contained file rendered from the sealed
# rows by src/surfaces/render.py, gated by lint-frame-presence, lint-no-ranking
# and check-mark before it is uploaded.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: render and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Python 3.11, the reference runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The seal must verify before anything is published
        run: python tools/verify.py

      - name: Render the register
        run: python src/surfaces/render.py

      - name: The rendering gates
        run: |
          python tools/lint-frame-presence.py
          python tools/lint-no-ranking.py
          python tools/check-mark.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
