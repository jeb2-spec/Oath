# Publish the rendered register with GitHub Pages. ECOSYSTEM.md §1.5 named GitHub
# Pages as one of two hosts; keeping everything on GitHub was the maintainer's call
# on 2026-09-22.
#
# The maintainer enabled Pages with GitHub Actions as its source and flipped the site
# public on 2026-09-23, after the Council's first reading of the pages (PR #27). The
# repository itself went public on 2026-09-26. Every push to main publishes.
#
# Nothing is published until the build verifies and nothing published before has been
# rewritten or dropped (the Findings and the Signal versions, against main as it stood
# before this push). Every page published here is one self-contained file rendered from
# the sealed rows by src/surfaces/render.py, gated by lint-frame-presence, lint-no-ranking,
# check-mark and lint-verdict-language before it is uploaded. Since the first
# Signal the site carries Findings, so the verdict lint reads the rendered pages
# themselves here too, not only the sources they are made from.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: render and publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Python 3.11, the reference runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The published record, main as it stood before this push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "OATH_PUBLISHED_REF=$BEFORE" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          fi

      - name: The seal must verify before anything is published
        run: python tools/verify.py

      - name: Nothing published before is rewritten or dropped (Invariants 11, 12, 14)
        run: |
          python tools/check-signal-versions.py
          python tools/check-supersessions.py
          python tools/check-removals.py

      - name: The anchor the footer states is the one the proofs hold
        run: python tools/anchor.py

      - name: Render the register
        run: python src/surfaces/render.py

      - name: The rendering gates
        run: |
          python tools/lint-frame-presence.py
          python tools/lint-no-ranking.py
          python tools/check-mark.py
          python tools/lint-verdict-language.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the rendered site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
