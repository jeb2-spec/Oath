# The gates, on every push and every pull request. NEXT.md Phase 1 T.5.
#
# Each step is one gate the doctrine names, in the order a stranger would run
# them. A gate that fails fails the build. A gate whose tool is not on the branch
# yet warns loudly instead of passing quietly. The Python floor is 3.11, the
# reference runtime in pyproject.toml, so the job runs on the floor and not on
# whatever is newest.
#
# Three gates compare this tree with the published record: a published Finding never
# changes or disappears (Invariants 12 and 14), a published row of the record never
# disappears and its facts only accrue (Invariant 14), and a published Signal version
# never changes (Invariant 11). On a pull request the published record is its base, main as
# it stands. On a push to main it is main as it stood before the push, because by then
# main is the pushed commit and a gate comparing it with itself would prove nothing (the
# Council's reading of the first Signal, 2026-09-26). A gate that cannot read the record
# fails rather than pass.

name: verify

# One run per commit, not two. `on: push` without a branch filter fired on every branch, and
# `on: pull_request` fired again on the same commit, so every push to a branch with an open pull
# request verified it twice: on 2026-09-27 that was 38 of 93 runs, 41% of them, about an hour of
# runner time in a day. Pushes to main are verified as pushes (which is also what sets
# OATH_PUBLISHED_REF to main as it stood before), and every other commit is verified once, as a
# pull request. The trade is that a branch pushed with no pull request open is not verified until
# one is, which is the moment anyone else could be affected by it.
on:
  push:
    branches: [main]
  pull_request:

# A superseded pull request run is cancelled, because the only run that matters is the one on the
# head a reviewer will read. A run on main is never cancelled: main's verification is the record
# that the base branch is sound, and a cancelled run there would leave a commit nobody checked.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: the gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: The published record the comparing gates read, main before this push or the base of this pull request
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            echo "OATH_PUBLISHED_REF=$BEFORE" >> "$GITHUB_ENV"
            echo "Comparing with main as it stood before this push: $BEFORE"
          else
            git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
            echo "Comparing with main as it stands: $(git rev-parse refs/remotes/origin/main)"
          fi

      - name: Python 3.11, the reference runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Python dev toolchain named in pyproject.toml
        run: python -m pip install "ruff>=0.16,<0.17" "pytest>=8" "pypdf==6.19.0"

      - name: Ruff, check and format
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pytest, every tool's tests
        run: python -m pytest -q

      - name: verify, the seal (Invariant 9)
        run: python tools/verify.py

      - name: tamper-test, the seal is not decorative (Rubric gate 4)
        run: python tools/tamper-test.py

      - name: validate-schemas (Invariants 2, 3, 4, 6)
        run: python tools/validate-schemas.py

      - name: rebuild, every Signal file regenerates from the definitions and the rows (Rubric gate 4)
        run: python tools/rebuild.py

      - name: check-signal-versions, no silent redefinition (Invariant 11)
        run: python tools/check-signal-versions.py

      - name: check-supersessions, a published Finding stays and a correction chains (Invariants 12, 14)
        run: python tools/check-supersessions.py

      - name: check-removals, a published row stays and its facts only accrue (Invariant 14)
        run: python tools/check-removals.py

      - name: check-aggregator-sole, every Finding rests on a primary source (Invariant 5)
        run: python tools/check-aggregator-sole.py

      - name: anchor, ANCHORS.md says what the proofs say, and each proof commits to its build's digest (NEXT.md S.4)
        run: python tools/anchor.py

      - name: render the register as static pages (ECOSYSTEM section 1.3)
        run: python src/surfaces/render.py

      - name: lint-frame-presence, the frame on every page that names an officeholder (Invariant 7)
        run: python tools/lint-frame-presence.py

      - name: lint-no-ranking, no ranking on the index or any Signal page (Invariant 13)
        run: python tools/lint-no-ranking.py

      - name: lint-no-names, the sealed state and run records name no person (Invariants 7, 13)
        run: python tools/lint-no-names.py

      - name: measure-guards, every guard in the list has a failing input
        run: python tools/measure-guards.py

      - name: highlight-charter-change, no silent softening of the antidrift core (Invariant 17)
        run: python tools/highlight-charter-change.py

      - name: check-mark, the seal is struck and legible (ECOSYSTEM section 2.4)
        run: python tools/check-mark.py

      - name: lint-verdict-language, the rendered pages included (Invariant 1)
        run: python tools/lint-verdict-language.py

      - name: scan-secrets, nothing of a secret or of one person's life lands in git (Invariant 10)
        run: python tools/scan-secrets.py

      - name: check-crossrefs (Council section 5, mode 7)
        run: |
          if [ -f tools/check-crossrefs.py ]; then
            python tools/check-crossrefs.py
          else
            echo "::warning::tools/check-crossrefs.py is not on this branch yet (PR #5); this gate did not run."
          fi

      - name: Every JSON file the build or the survey wrote still parses
        run: |
          for f in data/meta.json docs/related-work/data/*.json schemas/*.json biome.json package.json; do
            python -m json.tool "$f" > /dev/null || { echo "::error::$f does not parse"; exit 1; }
          done

      - name: Keep the rendered register from this run, downloadable for fourteen days
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: docs/build
          retention-days: 14
          if-no-files-found: error

      - name: Node 24, the runtime for the Signals' reference implementation
        # Vitest 5 needs Node 22.12 or later, and Node 20 left support in April 2026.
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Biome, TypeScript, and Vitest (the reference implementation agrees with every Finding)
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: oath-doctor, the session-start read-back, on a clean clone (Phase 1 ship gate)
        run: python scripts/oath-doctor.py
