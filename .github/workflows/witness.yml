# Ask the Internet Archive whether it holds, byte for byte, each document a published Finding
# rests on. tools/witness.py; docs/design/an-outside-witness.md.
#
# The register keeps no filed document, only each one's SHA-256. A hash proves which bytes were
# read only while someone still holds bytes to hash, and the Archive crawls the Clerk's site on
# its own account. This run lists its captures of each document, fetches one capture of each
# distinct payload, hashes it, and reports held, differs, none or unchecked, per document.
#
# It observes and never submits: whether the register should ask the Archive to capture a
# document is the Council's question, not this job's. It writes nothing to the repository. The
# report is the job summary and an artifact; nothing here enters the sealed record until the
# Council has read what the record would say. It runs by hand, because the sessions that build
# this register cannot reach web.archive.org and the runners can. A run that could not check a
# document, or found an outside copy of other bytes, fails and says which.

name: witness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: witness
  cancel-in-progress: false

jobs:
  witness:
    name: an outside witness for the documents the Findings rest on
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Python 3.11, the reference runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ask the Internet Archive, one request at a time
        run: python tools/witness.py --report witness-report.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: witness-report
          path: witness-report.json
          if-no-files-found: warn
